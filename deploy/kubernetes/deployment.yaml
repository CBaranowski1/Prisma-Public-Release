apiVersion: apps/v1
kind: Deployment
metadata:
  name: prisma
  labels:
    app.kubernetes.io/name: prisma
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: prisma
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prisma
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-brains
          image: prisma-app
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /app/data/brains
              cp -R -n /app/brains/. /app/data/brains/
              find /app/brains -mindepth 2 -maxdepth 2 -type f -name brain.json |
                while IFS= read -r source; do
                  relative="${source#/app/brains/}"
                  mkdir -p "/app/data/brains/$(dirname "$relative")"
                  cp "$source" "/app/data/brains/$relative"
                done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: prisma
          image: prisma-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: prisma-config
            - secretRef:
                name: prisma-secrets
                optional: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: cache
              mountPath: /app/.cache
            - name: local
              mountPath: /app/.local
            - name: ssh
              mountPath: /app/.ssh
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prisma-data
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: local
          emptyDir:
            sizeLimit: 10Gi
        - name: ssh
          emptyDir:
            sizeLimit: 100Mi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
