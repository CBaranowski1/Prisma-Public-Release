name: Rebuild security-patched Python lockfiles
on:
  push:
    branches: [security/public-hygiene-audit-20261020]
    paths:
      - .github/workflows/regenerate-audited-locks.yml
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/public-hygiene-audit-20261020
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Resolve and hash-lock patched packages
        run: |
          python -m pip install uv==0.12.0
          python scripts/lock_dependencies.py
          git diff --stat -- requirements.txt requirements-dev.txt
      - name: Verify locked dependencies and run advisory audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Commit regenerated lockfiles to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt requirements-dev.txt
          git diff --cached --quiet || git commit -m "security: refresh hash-locked dependencies after advisory fixes"
          git push origin HEAD:security/public-hygiene-audit-20261020
