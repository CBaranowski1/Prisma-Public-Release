name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      - run: python -m compileall -q app.py core routes src services scripts tests

  ruff-lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      # Rule selection, excludes (venv, node_modules, data, desktop, ollama)
      # and per-file-ignores (src/database.py F401, app.py E402, ...) live in
      # pyproject.toml [tool.ruff*] so local runs match CI exactly.
      - run: pip install ruff
      - run: ruff check .

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      # Syntax-check our own JS (skip vendored libs in static/lib).
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    # REQUIRED gate (LOCK-01, v3.0 Phase 43): WS-B (Phase 36) drove the suite to a green
    # baseline — 0 failed / 3339 passed under the canonical Python 3.11.9 (Phase 37). A red
    # test now blocks merge. NOTE: the green baseline was measured on Windows 3.11.9; this
    # job runs ubuntu-latest 3.11, so the first PR run confirms cross-platform parity — any
    # genuinely Linux-specific red is handled per FLOOR-03 (fix to green, or a documented
    # skipif(platform, reason=...)), never re-hidden behind continue-on-error.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
      - run: python -m bandit -q -r src core routes scripts -ll
      - name: Frontier architecture contract gate
        run: python scripts/frontier_eval_gate.py --mode offline --output .artifacts/frontier-offline.json
      - run: python -m pytest -q
