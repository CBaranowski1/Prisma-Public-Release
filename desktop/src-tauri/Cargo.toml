[package]
name = "prism-desktop"
version = "0.1.5"
edition = "2021"
description = "Prisma native desktop application"

[lib]
name = "prism_desktop_lib"
crate-type = ["lib"]
path = "src/lib.rs"

[[bin]]
name = "prism-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rand = "0.8"
url = "2"
rfd = "0.15"
sha2 = "0.10"
