# Optional SparkLab/GLM local model overlay for self-hosted Prisma.
# Public portable example: no private host paths, fixed subnet, static
# credentials or forced unauthenticated remote inference.
#
# Usage: set DGX_SPARK_BASE_URL, DGX_SPARK_MODEL and DGX_SPARK_API_KEY in an
# ignored .env file. Keep the server on a trusted private network.
# docker compose -f docker-compose.yml -f docker/sparklab-glm.yml up -d
services:
  prisma:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DGX_SPARK_BASE_URL: ${DGX_SPARK_BASE_URL:-http://host.docker.internal:1919/v1}
      DGX_SPARK_API_KEY: ${DGX_SPARK_API_KEY:-}
      DGX_SPARK_MODEL: ${DGX_SPARK_MODEL:-}
      DGX_SPARK_MAX_MODEL_LEN: ${DGX_SPARK_MAX_MODEL_LEN:-32768}
      DGX_SPARK_ALLOW_INSECURE_NO_AUTH: "false"
