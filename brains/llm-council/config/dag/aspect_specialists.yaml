# aspect_specialists.yaml — the EXPANDED seat graph (opt-in).
#   triage -> {dimension reviewers + per-topic language specialists}
#          -> {2 mid-overseers} -> chief
id: aspect_specialists
description: "Expanded mesh: triage -> dimension reviewers + gated language specialists -> mid-overseers -> chief"

seats:
  - {id: triage, role: triage, model_ref: triage, lens: routing, stance: classifier, prompt_path: triage.md, temperature: 0.0, consumes: []}

  - {id: reviewer_correctness, role: reviewer, model_ref: reviewer.correctness, lens: correctness, stance: "logic & edge-case skeptic", prompt_path: reviewer_correctness.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_performance, role: reviewer, model_ref: reviewer.performance, lens: performance, stance: "efficiency / complexity hawk", prompt_path: reviewer_performance.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_redundancy, role: reviewer, model_ref: reviewer.correctness, lens: redundancy, stance: "DRY / duplication / dead-code hunter", prompt_path: reviewer_redundancy.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_security, role: reviewer, model_ref: reviewer.security, lens: security, stance: "adversarial red-teamer", prompt_path: reviewer_security.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_maintainability, role: reviewer, model_ref: reviewer.maintainability, lens: maintainability, stance: "change-safety auditor", prompt_path: reviewer_maintainability.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_clarity, role: reviewer, model_ref: reviewer.maintainability, lens: clarity, stance: "readability & naming advocate", prompt_path: reviewer_clarity.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_prompting, role: reviewer, model_ref: reviewer.security, lens: prompting, stance: "LLM-integration & prompt-safety reviewer", prompt_path: reviewer_prompting.md, temperature: 0.2, group: mid_b, consumes: [triage]}

  - {id: specialist_postgresql, role: reviewer, model_ref: reviewer.correctness, lens: postgresql, stance: "PostgreSQL / SQL specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [postgresql, sql]}
  - {id: specialist_oracle_plsql, role: reviewer, model_ref: reviewer.correctness, lens: oracle_plsql, stance: "Oracle PL/SQL specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [oracle_plsql]}
  - {id: specialist_ruby, role: reviewer, model_ref: reviewer.maintainability, lens: ruby, stance: "Ruby / Rails specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [ruby]}
  - {id: specialist_python, role: reviewer, model_ref: reviewer.correctness, lens: python, stance: "Python specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [python]}
  - {id: specialist_web, role: reviewer, model_ref: reviewer.maintainability, lens: "typescript / javascript", stance: "TypeScript / JavaScript specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [typescript, javascript]}
  - {id: specialist_bash, role: reviewer, model_ref: reviewer.security, lens: bash, stance: "Shell / Bash specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [bash, powershell]}
  - {id: specialist_abap, role: reviewer, model_ref: reviewer.correctness, lens: abap, stance: "SAP ABAP specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [abap]}
  - {id: specialist_java, role: reviewer, model_ref: reviewer.correctness, lens: java, stance: "Java / JVM specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [java]}
  - {id: specialist_csharp, role: reviewer, model_ref: reviewer.maintainability, lens: csharp, stance: "C# / .NET specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [csharp, dotnet]}
  - {id: specialist_go, role: reviewer, model_ref: reviewer.performance, lens: go, stance: "Go specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [go, golang]}
  - {id: specialist_rust, role: reviewer, model_ref: reviewer.correctness, lens: rust, stance: "Rust specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [rust]}
  - {id: specialist_cpp, role: reviewer, model_ref: reviewer.performance, lens: cpp, stance: "C / C++ specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [cpp, c++]}
  - {id: specialist_php, role: reviewer, model_ref: reviewer.maintainability, lens: php, stance: "PHP specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [php]}
  - {id: specialist_frontend, role: reviewer, model_ref: reviewer.maintainability, lens: frontend, stance: "CSS / HTML / accessibility specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [css, scss, html, tailwind, accessibility, a11y, frontend, react, vue, svelte]}
  - {id: specialist_devops, role: reviewer, model_ref: reviewer.security, lens: "infrastructure as code", stance: "DevOps / IaC / CI-CD specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [terraform, kubernetes, k8s, docker, dockerfile, helm, ci, cd, ansible, iac]}
  - {id: specialist_mobile, role: reviewer, model_ref: reviewer.correctness, lens: mobile, stance: "iOS / Android mobile specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [swift, kotlin, android, ios, swiftui, jetpack, flutter, objc]}
  - {id: specialist_dataeng, role: reviewer, model_ref: reviewer.performance, lens: "data engineering", stance: "data-pipeline / ETL / streaming specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [spark, etl, airflow, dbt, kafka, pipeline, pyspark, dataeng, flink, beam]}

  - {id: reviewer_testing, role: reviewer, model_ref: reviewer.correctness, lens: testing, stance: "test-adequacy & coverage advocate", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_api, role: reviewer, model_ref: reviewer.maintainability, lens: "api design", stance: "contract & backward-compatibility reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_observability, role: reviewer, model_ref: reviewer.performance, lens: observability, stance: "operability & telemetry reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_documentation, role: reviewer, model_ref: reviewer.maintainability, lens: documentation, stance: "docs & comment-quality reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}

  - {id: specialist_database, role: reviewer, model_ref: reviewer.correctness, lens: "database design", stance: "schema / data-modeling specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [database, schema, ddl, erd, normalization, data-modeling]}
  - {id: specialist_erp, role: reviewer, model_ref: reviewer.maintainability, lens: "ERP systems", stance: "ERP systems specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [erp, sap, netsuite, dynamics, erpnext]}
  - {id: specialist_ftz, role: reviewer, model_ref: reviewer.security, lens: "foreign trade zones", stance: "FTZ / customs-compliance specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [ftz, foreign-trade-zone, customs, bonded, ctpat]}
  - {id: specialist_wms, role: reviewer, model_ref: reviewer.maintainability, lens: "WMS systems", stance: "warehouse-management specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [wms, warehouse, inventory, fulfillment, logistics]}

  # --- agents added from a capability comparison (architecture, agent-SDK, a11y, dep-security, concurrency, meta) ---
  - {id: specialist_architecture, role: reviewer, model_ref: reviewer.maintainability, lens: "software architecture", stance: "systems architect / design reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: specialist_agentsdk, role: reviewer, model_ref: reviewer.correctness, lens: "agent SDK & tooling", stance: "Claude Agent SDK / tooling reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [agent, sdk, tool, tools, mcp, claude, subagent, hook, skill]}
  - {id: reviewer_concurrency, role: reviewer, model_ref: reviewer.correctness, lens: "concurrency & async safety", stance: "race-condition / deadlock / atomicity hawk", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: specialist_meta, role: reviewer, model_ref: reviewer.maintainability, lens: "process & self-improvement", stance: "council meta-reviewer (refines agents & prompts from reflections)", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_accessibility, role: reviewer, model_ref: reviewer.maintainability, lens: "accessibility (a11y)", stance: "accessibility & inclusive-UX reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_depsec, role: reviewer, model_ref: reviewer.security, lens: "dependency & supply-chain security", stance: "SCA / SBOM / license / CVE auditor", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}

  # --- round 2: reliability/infra lenses + seating existing-memory specialties ---
  - {id: specialist_backend, role: reviewer, model_ref: reviewer.correctness, lens: "backend services", stance: "backend / service-design reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: specialist_ml, role: reviewer, model_ref: reviewer.correctness, lens: "machine learning", stance: "ML / MLOps reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [ml, model, training, inference, pytorch, tensorflow, sklearn, llm, embedding]}
  - {id: specialist_iac, role: reviewer, model_ref: reviewer.security, lens: "infrastructure as code", stance: "IaC (Terraform/K8s/Helm) reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [terraform, pulumi, cloudformation, kubernetes, helm, ansible, iac]}
  - {id: specialist_distributed, role: reviewer, model_ref: reviewer.correctness, lens: "distributed systems", stance: "distributed-systems / consistency reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_resilience, role: reviewer, model_ref: reviewer.correctness, lens: "resilience & error handling", stance: "reliability / failure-mode reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_migration, role: reviewer, model_ref: reviewer.correctness, lens: "migration & compatibility", stance: "backward-compat / migration-safety reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: reviewer_privacy, role: reviewer, model_ref: reviewer.security, lens: "data privacy & compliance", stance: "privacy / PII / GDPR reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_finops, role: reviewer, model_ref: reviewer.performance, lens: "cloud cost / FinOps", stance: "cost-efficiency reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_i18n, role: reviewer, model_ref: reviewer.maintainability, lens: "internationalization", stance: "i18n / l10n reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_licensing, role: reviewer, model_ref: reviewer.security, lens: "licensing & legal/IP", stance: "OSS-license / IP reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_ux, role: reviewer, model_ref: reviewer.maintainability, lens: "user experience", stance: "UX / usability reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: reviewer_product, role: reviewer, model_ref: reviewer.maintainability, lens: "product & requirements", stance: "product / requirements reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}

  # --- round 3: seat the last specialty clusters (loop converges after this) ---
  - {id: specialist_codegen, role: reviewer, model_ref: reviewer.correctness, lens: "code generation", stance: "code-generation / scaffolding reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: specialist_domain, role: reviewer, model_ref: reviewer.maintainability, lens: "domain modeling", stance: "domain-driven-design reviewer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage]}
  - {id: specialist_access, role: reviewer, model_ref: reviewer.correctness, lens: "MS Access / VBA", stance: "Access / VBA specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [access, vba, msaccess, dao, ado, jet]}
  - {id: specialist_trade, role: reviewer, model_ref: reviewer.security, lens: "international trade compliance", stance: "trade-compliance / customs specialist", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage], activation: [trade, customs, tariff, hts, incoterm, sanctions, export, import]}

  # --- gstack roles: strategy, delivery, devex, retro (also organized into teams) ---
  - {id: specialist_ceo, role: reviewer, model_ref: reviewer.maintainability, lens: "product strategy", stance: "founder / CEO 10-star product reviewer", prompt_path: reviewer_specialist.md, temperature: 0.3, group: mid_a, consumes: [triage]}
  - {id: specialist_release, role: reviewer, model_ref: reviewer.correctness, lens: "release engineering", stance: "release / delivery engineer", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_a, consumes: [triage], activation: [release, deploy, ci, cd, pipeline, pr, ship, canary, rollback]}
  - {id: specialist_devex, role: reviewer, model_ref: reviewer.maintainability, lens: "developer experience", stance: "DevEx lead", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}
  - {id: specialist_retro, role: reviewer, model_ref: reviewer.maintainability, lens: "process & retrospective", stance: "continuous-improvement / retro lead", prompt_path: reviewer_specialist.md, temperature: 0.2, group: mid_b, consumes: [triage]}

  - {id: overseer_mid_a, role: mid_overseer, model_ref: overseer.mid_a, lens: "engineering quality", stance: "pragmatic tech lead", prompt_path: overseer_mid_a.md, temperature: 0.3, consumes: [reviewer_correctness, reviewer_performance, reviewer_redundancy, reviewer_testing, reviewer_api, specialist_postgresql, specialist_oracle_plsql, specialist_ruby, specialist_python, specialist_web, specialist_abap, specialist_java, specialist_csharp, specialist_go, specialist_rust, specialist_cpp, specialist_database, specialist_erp, specialist_mobile, specialist_dataeng, specialist_architecture, specialist_agentsdk, reviewer_concurrency, specialist_meta, specialist_backend, specialist_ml, specialist_iac, specialist_distributed, reviewer_resilience, reviewer_migration, specialist_codegen, specialist_domain, specialist_ceo, specialist_release]}
  - {id: overseer_mid_b, role: mid_overseer, model_ref: overseer.mid_b, lens: "risk & hygiene", stance: "risk-averse auditor", prompt_path: overseer_mid_b.md, temperature: 0.3, consumes: [reviewer_security, reviewer_maintainability, reviewer_clarity, reviewer_prompting, reviewer_observability, reviewer_documentation, specialist_bash, specialist_php, specialist_ftz, specialist_wms, specialist_frontend, specialist_devops, reviewer_accessibility, reviewer_depsec, reviewer_privacy, reviewer_finops, reviewer_i18n, reviewer_licensing, reviewer_ux, reviewer_product, specialist_devex, specialist_retro]}
  - {id: overseer_chief, role: chief, model_ref: overseer.chief, lens: "final verdict", stance: "decisive arbiter", prompt_path: overseer_chief.md, temperature: 0.3, consumes: [overseer_mid_a, overseer_mid_b]}
