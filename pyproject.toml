# Direct runtime dependencies are maintained in requirements.in and compiled
# into the hash-locked requirements.txt used by Docker/raw pip. Development and
# evaluation tools live in the separate requirements-dev lock. fastembed is a
# core dependency for brain embedding recall (BRAIN-01, D-06), not an extra.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = [
    "venv",
    "node_modules",
    "data",
    "desktop",
    "ollama",
]

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"src/database.py" = ["F401"]
"src/constants.py" = ["F401", "F403"]
"core/__init__.py" = ["F401", "F403", "F405"]
"core/auth.py" = ["E402"]
"core/database.py" = ["E402"]
